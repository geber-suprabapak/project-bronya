services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/geber-suprabapak/project-bronya:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
